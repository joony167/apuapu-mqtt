# 어푸어푸 팀 브로커 설정 (Eclipse Mosquitto 2.x, Windows)
#
# Mosquitto 2.x는 listener를 직접 선언하지 않으면 localhost에만 바인딩한다.
# 기본 설치 상태에서 팀원 노트북이나 보드가 못 붙는 이유가 이것이다.
# 아래 두 listener가 브로커를 팀 네트워크에 연다.
#
# 주의: 익명 접속을 허용한다. 같은 네트워크에 있는 사람은 누구나 publish /
# subscribe 할 수 있다. 신뢰할 수 있는 교실 LAN에서만 쓸 것.

# --- MQTT over TCP: ESP32 보드, mosquitto_pub/sub, 데스크톱 클라이언트 ---
listener 1883 0.0.0.0
protocol mqtt

# --- MQTT over WebSockets: 브라우저(dashboard.html) ---
# 브라우저는 raw TCP 소켓을 열 수 없어서 1883으로는 접속이 불가능하다.
# 이 listener가 대시보드를 위해 존재한다.
listener 9001 0.0.0.0
protocol websockets

allow_anonymous true

# 브로커를 재시작해도 retained 메시지와 세션이 유지되도록 한다.
# Program Files 대신 ProgramData에 두어야 업그레이드에도 살아남고
# 권한 문제 없이 쓰기가 가능하다.
persistence true
persistence_location C:\ProgramData\mosquitto\

# `log_dest eventlog`는 Mosquitto 2.1에서 제거되었다. 그대로 쓰면 브로커가
# 시작을 거부한다. 파일로 로그를 남긴다 (디렉터리는 apply 스크립트가 생성).
log_dest file C:\ProgramData\mosquitto\mosquitto.log
log_type error
log_type warning
log_type notice
log_type information

# 팀원 여러 명 + 보드 여러 대가 동시에 붙는다.
max_connections -1
